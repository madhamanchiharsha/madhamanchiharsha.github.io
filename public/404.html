<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harsha Madhamanchi — Software Engineer</title>
  <script>
    // Redirect to the SPA, preserving the path as a query param so the router can handle it.
    var l = window.location;
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?r=' + encodeURIComponent(l.pathname + l.search) + l.hash);
  </script>
</head>
<body></body>
</html>
